# OPTIONAL. Only use this if you specifically want a daily report sent from GitHub Actions
# with no second always-on host — see the big warning in daily_report.py's docstring: this path
# only ever includes the 3 built-in portfolios/benchmarks defined in the code, never any custom
# portfolios you've created via Telegram, because a GitHub Actions runner starts from a fresh,
# empty checkout every time (no persistent disk).
#
# If you want custom portfolios in your daily report, don't enable this workflow — the bot
# already sends a daily report on its own (via application.job_queue.run_daily) from whatever
# host is running it continuously, using its live, up-to-date data. See README.md.
#
# This workflow runs ONCE per schedule trigger and exits — it does NOT run the bot itself
# (application.run_polling() is never called here), so it fits GitHub Actions' model of finite
# jobs rather than a 24/7 process.

name: Daily Portfolio Report (stateless, built-in portfolios only)

on:
  schedule:
    # 13:00 UTC daily ≈ 9am US Eastern — edit the cron expression to change the time.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # adds a "Run workflow" button on the Actions tab, for manual testing

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # safety net: this job must finish and exit, never hang indefinitely

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send the daily report
        run: python daily_report.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
